const TYPES={C:'文化遺産',N:'自然遺産',M:'複合遺産'};const STORE='wh3_v1';let saved={};try{saved=JSON.parse(localStorage.getItem(STORE)||'{}')}catch(e){};let state={done:saved.done||{},wrong:saved.wrong||{},star:saved.star||{},japan:saved.japan||false,tab:'home',q:[],idx:0,answered:false,score:0,mode:'',start:0,filter:'',country:'all',type:'all',page:0};const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem(STORE,JSON.stringify({done:state.done,wrong:state.wrong,star:state.star,japan:state.japan}))}catch(e){toast('保存容量が不足しています')}}function toast(s){$('toast').textContent=s;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2300)}function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}const isJP=s=>s.c.includes('日本');const pool=()=>state.japan?SITES.filter(isJP):SITES;function setTab(t){state.tab=t;render()}function nav(){let items=[['home','🏠 ホーム'],['atlas','🖼️ 写真図鑑'],['quiz','📝 4択学習'],['photo','📷 写真当て'],['exam','⏱️ 模擬試験'],['review','🔁 苦手復習']];$('nav').innerHTML=items.map(([k,v])=>`<button class="${state.tab===k?'active':''}" onclick="setTab('${k}')">${v}</button>`).join('')}function badge(s){return `<span class="tag">${esc(s.c)}</span><span class="tag">${TYPES[s.t]}</span>`}function stats(){let d=Object.keys(state.done).length,w=Object.keys(state.wrong).filter(k=>state.wrong[k]>0).length;return `<div class="stats"><div class="stat"><strong>${d}</strong><small>解答済み問題</small></div><div class="stat"><strong>${w}</strong><small>苦手問題</small></div><div class="stat"><strong>${Object.keys(state.star).length}</strong><small>お気に入り</small></div></div>`}function home(){return `<section class="panel"><h2>今日の学習を始めよう</h2><p class="muted">500件の遺産を使った国・地域と遺産種別のオリジナル問題を1000問収録。写真当ては追加の練習モードです。</p>${stats()}<p class="row"><label><input type="checkbox" ${state.japan?'checked':''} onchange="state.japan=this.checked;save();render()"> 🇯🇵 日本の世界遺産を重点的に学ぶ</label></p><div class="controls"><button class="primary" onclick="start('quiz')">4択を10問</button><button onclick="start('photo')">写真当てを10問</button><button onclick="start('exam')">模擬試験60問</button><button onclick="setTab('atlas')">図鑑を見る</button></div></section><section class="panel"><h3>学習の進め方</h3><p>① 図鑑で写真と国・遺産種別を確認 → ② 4択問題 → ③ 苦手復習 → ④ 模擬試験。学習履歴はこのブラウザに保存されます。</p><p class="note">写真はCommonsの検索結果を取得するため、同名の別画像が表示される場合があります。写真の内容と遺産名が一致しているか確認して学習してください。画像取得にはインターネット接続が必要です。</p></section>`}function atlas(){let countries=[...new Set(SITES.map(x=>x.c))].sort((a,b)=>a.localeCompare(b,'ja'));let list=SITES.filter(s=>(!state.japan||isJP(s))&&(state.country==='all'||s.c===state.country)&&(state.type==='all'||s.t===state.type)&&(`${s.n} ${s.c}`.toLowerCase().includes(state.filter.toLowerCase())));let page=list.slice(state.page*24,(state.page+1)*24);return `<section class="panel"><h2>写真図鑑 <small class="muted">${list.length}件</small></h2><div class="controls"><input type="search" placeholder="遺産名・国名で検索" value="${esc(state.filter)}" oninput="state.filter=this.value;state.page=0;refreshAtlas()"><select onchange="state.country=this.value;state.page=0;refreshAtlas()"><option value="all">すべての国・地域</option>${countries.map(c=>`<option ${state.country===c?'selected':''}>${esc(c)}</option>`).join('')}</select><select onchange="state.type=this.value;state.page=0;refreshAtlas()"><option value="all">全種類</option>${Object.entries(TYPES).map(([k,v])=>`<option value="${k}" ${state.type===k?'selected':''}>${v}</option>`).join('')}</select></div><div id="atlasList">${tiles(page)}</div><div class="row" style="justify-content:center;margin-top:16px"><button onclick="state.page=Math.max(0,state.page-1);refreshAtlas()" ${state.page===0?'disabled':''}>前へ</button><span>${state.page+1} / ${Math.max(1,Math.ceil(list.length/24))}</span><button onclick="state.page=Math.min(${Math.max(0,Math.ceil(list.length/24)-1)},state.page+1);refreshAtlas()">次へ</button></div></section>`}function tiles(page){return `<div class="grid">${page.map(s=>`<div class="tile" onclick="detail(${SITES.indexOf(s)})"><div class="photo" data-photo="${SITES.indexOf(s)}"><small>📷 写真を読み込み中…</small></div><div class="info"><strong>${esc(s.n)}</strong><div>${badge(s)}</div></div></div>`).join('')}</div>`}function refreshAtlas(){render()}function detail(i){let s=SITES[i];state.tab='detail';state.detail=i;render()}function detailHTML(){let s=SITES[state.detail],i=state.detail;return `<section class="panel"><button onclick="setTab('atlas')">← 図鑑へ戻る</button><h2>${esc(s.n)}</h2><div class="bigphoto photo" data-photo="${i}"><small>📷 写真を読み込み中…</small></div><div id="credit-${i}"></div>${badge(s)}<p><strong>国・地域：</strong>${esc(s.c)}</p><p><strong>遺産の分類：</strong>${TYPES[s.t]}</p><p class="muted">国・遺産種別を確実に覚えましょう。詳細な登録年や登録基準は公式資料でも確認してください。</p><button class="${state.star[i]?'primary':''}" onclick="state.star[${i}]?delete state.star[${i}]:state.star[${i}]=1;save();render()">${state.star[i]?'★ お気に入り登録済み':'☆ お気に入りに追加'}</button></section>`}function allQuestions(){return SITES.flatMap((s,i)=>[{id:'c'+i,site:i,kind:'country',text:`「${s.n}」が所在する国・地域はどこ？`,answer:s.c},{id:'t'+i,site:i,kind:'type',text:`「${s.n}」の世界遺産の分類は？`,answer:TYPES[s.t]}])}const QUESTIONS=allQuestions();function choices(q){let s=SITES[q.site],others=q.kind==='country'?[...new Set(SITES.map(x=>x.c))].filter(c=>c!==s.c):Object.values(TYPES).filter(c=>c!==TYPES[s.t]);return shuffle([q.answer,...shuffle(others).slice(0,q.kind==='type'?2:3)])}function start(mode){let p=pool(),ids=new Set(p.map(x=>SITES.indexOf(x)));let arr=QUESTIONS.filter(q=>ids.has(q.site));if(mode==='review')arr=arr.filter(q=>state.wrong[q.id]>0);if(mode==='photo')arr=arr.filter(q=>q.kind==='country');if(!arr.length){toast('対象の問題がありません');return}state.mode=mode;state.q=shuffle(arr).slice(0,mode==='exam'?60:10).map(q=>({...q,opts:choices(q)}));state.idx=0;state.score=0;state.answered=false;state.start=Date.now();state.tab='session';render()}function answer(v){if(state.answered)return;let q=state.q[state.idx];state.answered=true;state.chosen=v;if(v===q.answer){state.score++;state.done[q.id]=(state.done[q.id]||0)+1;if(state.wrong[q.id])delete state.wrong[q.id]}else{state.wrong[q.id]=(state.wrong[q.id]||0)+1;state.done[q.id]=(state.done[q.id]||0)+1}save();render()}function next(){state.idx++;state.answered=false;state.chosen=null;render()}function session(){if(state.idx>=state.q.length){let pct=Math.round(state.score/state.q.length*100);return `<section class="panel"><h2>🎉 学習結果</h2><h1>${state.score} / ${state.q.length}問正解（${pct}%）</h1><p>所要時間：約${Math.max(1,Math.ceil((Date.now()-state.start)/60000))}分</p><p>${state.mode==='exam'?'模擬試験の目安として復習に活用してください。公式の合格判定ではありません。':'間違えた問題は苦手復習に登録されています。'}</p><button class="primary" onclick="start('${state.mode}')">もう一度</button> <button onclick="setTab('home')">ホームへ</button></section>`}let q=state.q[state.idx],s=SITES[q.site],photo=state.mode==='photo';return `<section class="panel"><div class="row" style="justify-content:space-between"><strong>${state.mode==='exam'?'模擬試験':photo?'写真当て':state.mode==='review'?'苦手復習':'4択学習'}</strong><span>${state.idx+1} / ${state.q.length}</span></div><div class="bar" style="margin:12px 0"><span style="width:${100*state.idx/state.q.length}%"></span></div>${photo?`<div class="bigphoto photo" data-photo="${q.site}"><small>📷 写真を読み込み中…</small></div><p class="question">写真の世界遺産がある国・地域は？</p><p class="muted">画像が読み込めない場合は「${esc(s.n)}」を手掛かりに回答してください。</p>`:`<p class="question">${esc(q.text)}</p>`}<div class="choices">${q.opts.map(o=>`<button class="choice ${state.answered?(o===q.answer?'correct':o===state.chosen?'wrong':''):''}" ${state.answered?'disabled':''} onclick="answer(${JSON.stringify(o).replace(/"/g,'&quot;')})">${esc(o)}</button>`).join('')}</div>${state.answered?`<div class="note" style="margin-top:16px"><strong>${state.chosen===q.answer?'⭕ 正解！':'❌ 不正解'}</strong><p>正解：${esc(q.answer)}</p><p>${esc(s.n)} — ${esc(s.c)}／${TYPES[s.t]}。関連する遺産も図鑑で確認しましょう。</p></div><button class="primary" style="margin-top:12px" onclick="next()">${state.idx===state.q.length-1?'結果を見る':'次の問題 →'}</button>`:''}</section>`}function review(){let n=QUESTIONS.filter(q=>state.wrong[q.id]>0).length;return `<section class="panel"><h2>苦手問題の復習</h2><p>現在の苦手問題：<strong>${n}問</strong></p><p class="muted">間違えた問題を優先的に出題し、正解すると苦手リストから外します。</p><button class="primary" onclick="start('review')">苦手問題を解く</button><hr><h3>学習データ</h3><button onclick="exportData()">進捗データを保存（JSON）</button> <button onclick="$('importFile').click()">進捗データを読み込む</button><input id="importFile" class="hide" type="file" accept="application/json" onchange="importData(this)"><p><button onclick="if(confirm('進捗データをすべて消去しますか？')){state.done={};state.wrong={};state.star={};save();render()}">学習履歴をリセット</button></p></section>`}function exportData(){let b=new Blob([JSON.stringify({done:state.done,wrong:state.wrong,star:state.star,japan:state.japan},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='世界遺産検定_学習進捗.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}async function importData(el){try{let d=JSON.parse(await el.files[0].text());state.done=d.done||{};state.wrong=d.wrong||{};state.star=d.star||{};state.japan=!!d.japan;save();render();toast('読み込みました')}catch(e){toast('読み込めませんでした')}}
// Wikimedia Commons API: only display images whose metadata advertises a Creative Commons or public domain license.
const CACHE={};const INFLIGHT=new Set();function queryFor(s){return s.n.replace(/（.*?）/g,'').replace(/、/g,' ').replace(/の(文化財|歴史地区|考古遺跡群)$/,'')+' '+(s.c==='日本'?'Japan':'UNESCO')}async function loadPhoto(i){if(CACHE[i]!==undefined)return CACHE[i];if(INFLIGHT.has(i))return null;INFLIGHT.add(i);let s=SITES[i];try{let params=new URLSearchParams({action:'query',generator:'search',gsrsearch:'filetype:bitmap '+queryFor(s),gsrnamespace:'6',gsrlimit:'8',prop:'imageinfo',iiprop:'url|extmetadata',iiurlwidth:'800',format:'json',origin:'*'});let r=await fetch('https://commons.wikimedia.org/w/api.php?'+params);if(!r.ok)throw Error('offline');let data=await r.json();let pages=Object.values(data.query?.pages||{});let found=pages.map(p=>({p,info:p.imageinfo?.[0]})).find(x=>{let meta=x.info?.extmetadata||{};let lic=(meta.LicenseShortName?.value||'').toLowerCase();return x.info?.thumburl&&(/cc|public domain|pd-|cc0/.test(lic))&&!/\.svg/i.test(x.p.title)});if(!found)throw Error('not found');let m=found.info.extmetadata;CACHE[i]={url:found.info.thumburl,description:found.info.descriptionurl,author:(m.Artist?.value||'').replace(/<[^>]*>/g,'').slice(0,120),license:(m.LicenseShortName?.value||'').replace(/<[^>]*>/g,'')};return CACHE[i]}catch(e){CACHE[i]=false;return false}finally{INFLIGHT.delete(i)}}let observer=new IntersectionObserver(entries=>{entries.forEach(async e=>{if(!e.isIntersecting)return;observer.unobserve(e.target);let i=Number(e.target.dataset.photo),data=await loadPhoto(i);if(!e.target.isConnected)return;if(!data){e.target.innerHTML='<small>📷 写真を取得できませんでした<br>名称から学習できます</small>';return}e.target.innerHTML=`<img loading="lazy" src="${esc(data.url)}" alt="${esc(SITES[i].n)}の参考写真">`;let credit=$('credit-'+i);if(credit)credit.innerHTML=`<div class="attr">画像: ${esc(data.author||'Wikimedia Commons contributor')} / ${esc(data.license)} · <a target="_blank" rel="noopener" href="${esc(data.description)}">出典・ライセンス</a></div>`})},{rootMargin:'350px'});function render(){nav();$('app').innerHTML=state.tab==='home'?home():state.tab==='atlas'?atlas():state.tab==='detail'?detailHTML():state.tab==='session'?session():state.tab==='review'?review():`<section class="panel"><h2>${state.tab==='photo'?'写真当てクイズ':state.tab==='exam'?'模擬試験':'4択クイズ'}</h2><p>${state.tab==='exam'?'60問をランダムに出題します。時間を計って実力を確認しましょう。':state.tab==='photo'?'写真を見て国・地域を選ぶ問題です。':'国・地域と世界遺産の分類を中心に10問出題します。'}</p><button class="primary" onclick="start('${state.tab}')">スタート</button></section>`;document.querySelectorAll('[data-photo]').forEach(e=>observer.observe(e))}render();
</script></body></html>
